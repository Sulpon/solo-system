[package]
name = "atlas-desktop"
version = "0.1.0"
description = "Atlas desktop shell (Windows) wrapping the existing Atlas Next.js application"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"

# Windows-only, and used for exactly one thing: putting the bundled Next.js
# server into a Job Object so Windows itself kills it if Atlas dies without
# running its own shutdown path (crash, Task Manager, taskkill /F). Without
# this the server is orphaned, keeps port 3000, and the NEXT Atlas launch
# fails with EADDRINUSE - see spawn_atlas_server. Already vendored via
# Tauri's own tree, so this adds no new download.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
