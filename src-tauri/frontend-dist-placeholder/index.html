<!doctype html>
<!--

  needs a real Node.js server (Route Handlers, the Supabase auth proxy,
  cookie-based session refresh) rather than static assets - see
  src-tauri/src/lib.rs, which always points the window at the real Next.js
  server (either `next dev` in development, or a bundled standalone server
  spawned as a sidecar in release builds).

  Tauri's config schema still requires `build.frontendDist` to point at an
  existing directory even though nothing here is ever loaded - this file
  exists only to satisfy that validation.
-->
